[package]
name = "tauri-plugin-chsmartbulb"
description = "Bluetooth and sound capture for the chsmartbulb app: BLE and SPP links to the bulb on Android, Linux and Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version = "1.90"
links = "tauri-plugin-chsmartbulb"

[dependencies]
async-trait.workspace = true
base64 = "0.22"
chsmartbulb-core.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = "2.12"
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
btleplug = "0.13"
futures = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
tokio = { workspace = true, features = ["net", "process", "io-util"] }

[target.'cfg(windows)'.dependencies]
cpal = "0.18"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Devices_Bluetooth"] }

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }
