[package]
name = "tauri-plugin-chsmartbulb"
description = "Bluetooth and sound capture for the chsmartbulb app: BLE and SPP links to the bulb on Android, Linux and Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version = "1.90"
links = "tauri-plugin-chsmartbulb"

[dependencies]
async-trait.workspace = true
base64 = "0.22"
chsmartbulb-core.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = "2.12"
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
btleplug = "0.13"
chsmartbulb-desktop.workspace = true

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }
