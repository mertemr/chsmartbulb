[package]
name = "chsmartbulb-app"
description = "Desktop and mobile app for the CHSmartBulb / BL08A speaker bulb"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version = "1.90"

[lib]
# the mobile build loads the app as a shared library
name = "chsmartbulb_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
chsmartbulb-core = { workspace = true, features = ["server"] }
getrandom = "0.3"
log.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-chsmartbulb = { path = "../plugin" }
tokio.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
