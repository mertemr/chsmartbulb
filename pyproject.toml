[project]
name = "chsmartbulb"
version = "0.1.0"
description = "Command line, agents and library for CHSmartBulb / BL08A Bluetooth speaker bulbs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mert Emirimam" }]
dependencies = []
keywords = ["bluetooth", "ble", "rfcomm", "smart-bulb", "led", "chsmartbulb", "bl08a"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]

[project.urls]
Repository = "https://github.com/mertemr/chsmartbulb"
Documentation = "https://github.com/mertemr/chsmartbulb/tree/main/docs"

[project.optional-dependencies]
ble = ["bleak>=0.22"]
audio = [
    "numpy>=1.24",
    # WASAPI loopback capture; Linux uses the parec tool instead
    "PyAudioWPatch>=0.2.12; sys_platform == 'win32'",
]
# the screen agent; mss captures on Windows, macOS and X11
screen = ["numpy>=1.24", "mss>=9"]

[project.scripts]
chsmartbulb = "chsmartbulb.cli:main"

[dependency-groups]
dev = [
    "numpy>=1.24",
    "soundcard>=0.4.3",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chsmartbulb"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = ["research"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "UP",           # idioms newer than requires-python allows are left alone
    "B",            # likely bugs
    "SIM", "C4", "PIE", "RET",
    "ASYNC",
    "PT",
    "PERF",
    "PYI",
    "TC",
    "RUF",
]
ignore = [
    "SIM105",  # try/except/pass with a comment reads better than contextlib.suppress
    "C408",    # dict(r=..., g=...) is used on purpose for channel maps
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "PT011",  # the errors under test carry free-form messages
]

[tool.ty.environment]
python-version = "3.10"
python-platform = "linux"

[tool.ty.src]
exclude = ["research"]

[tool.ty.analysis]
allowed-unresolved-imports = ["bleak", "bleak.**", "chsmartbulb_native", "mss", "pyaudiowpatch", "soundcard"]

[tool.uv]
# uv's downloadable Python builds are compiled without Bluetooth sockets.
python-preference = "only-system"
