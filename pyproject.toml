[project]
name = "chsmartbulb"
version = "0.1.0"
description = "Control CHSmartBulb / BL08A Bluetooth speaker bulbs without the vendor app"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mert Emirimam" }]
dependencies = []
keywords = ["bluetooth", "ble", "rfcomm", "smart-bulb", "led", "chsmartbulb", "bl08a"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]

[project.urls]
Repository = "https://github.com/mertemr/chsmartbulb"
Documentation = "https://github.com/mertemr/chsmartbulb/tree/main/docs"

[project.optional-dependencies]
ble = ["bleak>=0.22"]

[project.scripts]
chsmartbulb = "chsmartbulb.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chsmartbulb"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# uv's downloadable Python builds are compiled without Bluetooth sockets.
python-preference = "only-system"
