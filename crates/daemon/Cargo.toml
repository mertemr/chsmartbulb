[package]
name = "chsmartbulb-daemon"
description = "The background service of the CHSmartBulb / BL08A speaker bulb, on Linux and Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version = "1.90"

[[bin]]
name = "chsmartbulbd"
path = "src/main.rs"

[features]
default = ["portal"]
# follow the screen of a Wayland session; building it needs the PipeWire headers and libclang
portal = ["chsmartbulb-desktop/portal"]

[dependencies]
chsmartbulb-core = { workspace = true, features = ["server"] }
chsmartbulb-desktop.workspace = true
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
include_dir = "0.7"
log.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
