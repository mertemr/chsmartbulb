name: app

# The Rust core's tests, the Python package's with and without the Rust analysis,
# and the app and the daemon built for Android, Linux and Windows.
# The builds are attached to each run as artifacts; a tag like v0.1.0 also publishes them as a release.

on:
  push:
    # other branches are built by their pull request
    branches: [main]
    # the paths below are not looked at for a tag
    tags: ["v*"]
    paths: ["crates/**", "app/**", "web/**", "src/**", "tests/**", "pyproject.toml", "uv.lock", "Cargo.*", ".github/workflows/app.yml"]
  pull_request:
    paths: ["crates/**", "app/**", "web/**", "src/**", "tests/**", "pyproject.toml", "uv.lock", "Cargo.*", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # a newer push to a pull request or to main replaces the run before it
  group: app-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# A tag's build is what gets published, so it restores no cache: every step that keeps one
# is switched off for tags.

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: github.ref_type != 'tag'
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
          # the daemon's screen sharing on Wayland
          sudo apt-get install -y libpipewire-0.3-dev libclang-dev
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: ${{ github.ref_type != 'tag' && 'pnpm' || '' }}
          cache-dependency-path: |
            web/pnpm-lock.yaml
            app/pnpm-lock.yaml
      - name: Web interface
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm test
          pnpm build:app
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # the daemon and what it needs from the computer, where the check above does not build them
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: github.ref_type != 'tag'
        with:
          key: windows
      - run: cargo clippy -p chsmartbulb-daemon --all-targets -- -D warnings
      - run: cargo test -p chsmartbulb-core -p chsmartbulb-desktop -p chsmartbulb-daemon

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: github.ref_type != 'tag'
        with:
          key: python
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: ${{ github.ref_type != 'tag' }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Tests without the Rust core
        run: |
          uv sync --python-preference system
          uv run ruff check
          uv run pytest -q
      - name: Tests with the Rust core
        run: |
          uv pip install ./crates/python
          uv run python -c "import chsmartbulb_native; print(chsmartbulb_native.__version__)"
          uv run pytest -q

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: github.ref_type != 'tag'
        with:
          key: android
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: ${{ github.ref_type != 'tag' && 'pnpm' || '' }}
          cache-dependency-path: |
            web/pnpm-lock.yaml
            app/pnpm-lock.yaml
      - name: Install the web and app tooling
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir app install --frozen-lockfile
      - name: Generate the Android project
        working-directory: app
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          pnpm tauri android init --ci
          pnpm tauri icon icon.svg
          # the app can also reach a service on the local network over plain ws://
          sed -i 's/manifestPlaceholders\["usesCleartextTraffic"\] = "false"/manifestPlaceholders["usesCleartextTraffic"] = "true"/' \
            src-tauri/gen/android/app/build.gradle.kts
      - name: Build the APK
        working-directory: app
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          pnpm tauri android build --apk --ci --target aarch64 armv7 x86_64
      - name: Sign the APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          unsigned=$(find app/src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -n 1)
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > release.jks
            password="$KEYSTORE_PASSWORD"
          else
            # no signing key in the repository's secrets: a key for this run only, so an
            # installed build has to be removed before installing a newer one
            password=throwaway
            keytool -genkeypair -keystore release.jks -storepass "$password" -keypass "$password" -alias bulb \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=chsmartbulb"
          fi
          "$tools/zipalign" -f 4 "$unsigned" aligned.apk
          "$tools/apksigner" sign --ks release.jks --ks-pass "pass:$password" --out chsmartbulb.apk aligned.apk
          rm release.jks
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-apk
          path: chsmartbulb.apk

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: github.ref_type != 'tag'
        with:
          key: desktop
      - name: System libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: ${{ github.ref_type != 'tag' && 'pnpm' || '' }}
          cache-dependency-path: |
            web/pnpm-lock.yaml
            app/pnpm-lock.yaml
      - name: Build
        shell: bash
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir app install --frozen-lockfile
          cd app && pnpm tauri build --ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ runner.os }}
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

  daemon:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: github.ref_type != 'tag'
        with:
          key: daemon
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libpipewire-0.3-dev libclang-dev
      - run: cargo build --release -p chsmartbulb-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daemon-${{ runner.os }}
          path: |
            target/release/chsmartbulbd
            target/release/chsmartbulbd.exe
          if-no-files-found: error

  # a tag publishes what the jobs above built, once all of them passed
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, windows, python, android, desktop, daemon]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: The tag is the version everywhere
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -qx "version = \"$version\"" Cargo.toml
          grep -qx "version = \"$version\"" pyproject.toml
          grep -q "\"version\": \"$version\"" app/src-tauri/tauri.conf.json
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: built
      - name: Collect the files
        run: |
          mkdir release
          cp built/android-apk/chsmartbulb.apk "release/chsmartbulb-$VERSION-android.apk"
          find built/desktop-Linux built/desktop-Windows -type f -exec cp {} release/ \;
          cp built/daemon-Windows/chsmartbulbd.exe "release/chsmartbulbd-$VERSION-windows-x86_64.exe"
          # an archive, so the Linux daemon keeps its executable bit
          mkdir "chsmartbulbd-$VERSION-linux-x86_64"
          cp built/daemon-Linux/chsmartbulbd contrib/chsmartbulb.service LICENSE "chsmartbulbd-$VERSION-linux-x86_64/"
          chmod +x "chsmartbulbd-$VERSION-linux-x86_64/chsmartbulbd"
          tar czf "release/chsmartbulbd-$VERSION-linux-x86_64.tar.gz" "chsmartbulbd-$VERSION-linux-x86_64"
          uv build --wheel --out-dir release
          cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
