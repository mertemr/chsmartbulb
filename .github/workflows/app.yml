name: app

# The Rust core's tests, and the app built for Android, Linux and Windows.
# The builds are attached to each run as artifacts.

on:
  push:
    paths: ["crates/**", "app/**", "web/**", "Cargo.*", ".github/workflows/app.yml"]
  pull_request:
    paths: ["crates/**", "app/**", "web/**", "Cargo.*", ".github/workflows/app.yml"]
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web interface
        working-directory: web
        run: |
          npm ci
          npm run check
          npm test
          npm run build:app
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the web and app tooling
        run: |
          npm ci --prefix web
          npm ci --prefix app
      - name: Generate the Android project
        working-directory: app
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          npx tauri android init --ci
          npx tauri icon icon.svg
          # the app can also reach a Python service on the local network over plain ws://
          sed -i 's/manifestPlaceholders\["usesCleartextTraffic"\] = "false"/manifestPlaceholders["usesCleartextTraffic"] = "true"/' \
            src-tauri/gen/android/app/build.gradle.kts
      - name: Build the APK
        working-directory: app
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: npx tauri android build --apk --ci --target aarch64 armv7 x86_64
      - name: Sign the APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          unsigned=$(find app/src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -n 1)
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > release.jks
            password="$KEYSTORE_PASSWORD"
          else
            # no signing key in the repository's secrets: a key for this run only, so an
            # installed build has to be removed before installing a newer one
            password=throwaway
            keytool -genkeypair -keystore release.jks -storepass "$password" -keypass "$password" -alias bulb \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=chsmartbulb"
          fi
          "$tools/zipalign" -f 4 "$unsigned" aligned.apk
          "$tools/apksigner" sign --ks release.jks --ks-pass "pass:$password" --out chsmartbulb.apk aligned.apk
          rm release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: chsmartbulb.apk

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop
      - name: System libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        shell: bash
        run: |
          npm ci --prefix web
          npm ci --prefix app
          cd app && npx tauri build --ci
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
